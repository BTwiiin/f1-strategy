[project]
name = "f1-strategy"
version = "0.1.0"
description = "F1 tyre-pace forecasting and dry-race strategy comparison using OpenF1 data."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=2.0.1",
    "numpy>=2.5.5",
]

[project.scripts]
f1-strategy = "f1_strategy:main"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
